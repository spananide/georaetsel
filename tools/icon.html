<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Icon — Abreißkalender</title>
<style>
@font-face {
  font-family: 'Bricolage Grotesque';
  font-style: normal;
  font-weight: 200 800;
  font-display: block;
  src: url('../georaetsel/assets/fonts/bricolage-grotesque-var.woff2') format('woff2');
}

@font-face {
  font-family: 'Atkinson Hyperlegible Next';
  font-style: normal;
  font-weight: 200 800;
  font-display: block;
  src: url('../georaetsel/assets/fonts/atkinson-next-var.woff2') format('woff2');
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 512px;
  height: 512px;
  overflow: hidden;
  background-color: #f4efe3;
  -webkit-font-smoothing: antialiased;
}

/* Maskable safe area: central 70% of 512px = 358px box */
.safe-area {
  position: absolute;
  top: 77px;
  left: 77px;
  width: 358px;
  height: 358px;
  display: flex;
  flex-direction: column;
}

/* 16% of 358px safe area height = 57px */
.top-band {
  width: 100%;
  height: 57px;
  background-color: #c2351f;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 44px;
}

.hole {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background-color: #f4efe3;
  border: 8px solid #1b1a17;
}

.numeral-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.numeral {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 800;
  font-size: 230px;
  line-height: 0.82;
  letter-spacing: -0.04em;
  color: #1b1a17;
  transform: translateY(-8px);
}
</style>
</head>
<body>
<div class="safe-area">
  <div class="top-band">
    <div class="hole"></div>
    <div class="hole"></div>
  </div>
  <div class="numeral-area">
    <div class="numeral">12</div>
  </div>
</div>
</body>
</html>
