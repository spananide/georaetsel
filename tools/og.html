<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Tagesspiele — Abreißkalender</title>
<style>
@font-face {
  font-family: 'Bricolage Grotesque';
  font-style: normal;
  font-weight: 200 800;
  font-display: block;
  src: url('../georaetsel/assets/fonts/bricolage-grotesque-var.woff2') format('woff2');
}

@font-face {
  font-family: 'Atkinson Hyperlegible Next';
  font-style: normal;
  font-weight: 200 800;
  font-display: block;
  src: url('../georaetsel/assets/fonts/atkinson-next-var.woff2') format('woff2');
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background-color: #f4efe3;
  color: #1b1a17;
  -webkit-font-smoothing: antialiased;
}

.page {
  display: flex;
  width: 1200px;
  height: 630px;
}

/* Left ~55%: calendar sheet motif, brand title, and tagline */
.col-left {
  width: 660px;
  height: 630px;
  padding: 44px 0 44px 64px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.calendar-sheet {
  display: flex;
  flex-direction: column;
}

.top-rule-wrap {
  position: relative;
  width: 532px;
  height: 2px;
  background-color: #1b1a17;
  margin-bottom: 20px;
}

.hole {
  position: absolute;
  top: -11px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid #1b1a17;
  background-color: #f4efe3;
}

.hole-left {
  left: 96px;
}

.hole-right {
  right: 96px;
}

.date-row {
  display: flex;
  align-items: center;
  gap: 24px;
}

.numeral {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 800;
  font-size: 340px;
  line-height: 0.82;
  letter-spacing: -0.04em;
  color: #1b1a17;
}

.date-meta {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.month {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 700;
  font-size: 64px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: #1b1a17;
}

.weekday {
  font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif;
  font-weight: 400;
  font-size: 36px;
  line-height: 1.1;
  color: #5c574b;
}

.brand-section {
  display: flex;
  flex-direction: column;
}

.brand-title {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 800;
  font-size: 120px;
  line-height: 0.95;
  letter-spacing: -0.03em;
  color: #1b1a17;
  margin: 0;
}

.tagline {
  font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif;
  font-weight: 400;
  font-size: 36px;
  line-height: 1.2;
  color: #1b1a17;
  margin: 12px 0 0 0;
}

/* Right ~45%: 3x3 puzzle grid and rotated stamp */
.col-right {
  width: 540px;
  height: 630px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.grid-wrapper {
  position: relative;
  width: 366px;
  height: 366px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 120px);
  grid-template-rows: repeat(3, 120px);
  gap: 0;
  border-top: 6px solid #1b1a17;
  border-left: 6px solid #1b1a17;
}

.cell {
  width: 120px;
  height: 120px;
  border-right: 6px solid #1b1a17;
  border-bottom: 6px solid #1b1a17;
}

.cell-1 { background-color: #c2351f; }
.cell-2 { background-color: #f0b323; }
.cell-3 { background-color: #1b7f52; }
.cell-4 { background-color: #2c4fd0; }
.cell-5 { background-color: #e8e1d0; }
.cell-6 { background-color: #c2351f; }
.cell-7 { background-color: #1b7f52; }
.cell-8 { background-color: #f0b323; }
.cell-9 { background-color: #2c4fd0; }

.stamp {
  position: absolute;
  left: -28px;
  bottom: -16px;
  transform: rotate(-5deg);
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 800;
  font-size: 44px;
  text-transform: uppercase;
  border: 5px solid #c2351f;
  color: #c2351f;
  background: transparent;
  border-radius: 4px;
  letter-spacing: 0.06em;
  padding: 4px 18px;
  line-height: 1;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="page">
  <div class="col-left">
    <div class="calendar-sheet">
      <div class="top-rule-wrap">
        <div class="hole hole-left"></div>
        <div class="hole hole-right"></div>
      </div>
      <div class="date-row">
        <div class="numeral">12</div>
        <div class="date-meta">
          <div class="month">November</div>
          <div class="weekday">Donnerstag</div>
        </div>
      </div>
    </div>
    <div class="brand-section">
      <h1 class="brand-title">Tagesspiele</h1>
      <p class="tagline">Jeden Tag neue Rätsel auf Deutsch.</p>
    </div>
  </div>
  <div class="col-right">
    <div class="grid-wrapper">
      <div class="grid">
        <div class="cell cell-1"></div>
        <div class="cell cell-2"></div>
        <div class="cell cell-3"></div>
        <div class="cell cell-4"></div>
        <div class="cell cell-5"></div>
        <div class="cell cell-6"></div>
        <div class="cell cell-7"></div>
        <div class="cell cell-8"></div>
        <div class="cell cell-9"></div>
      </div>
      <div class="stamp">GELÖST</div>
    </div>
  </div>
</div>
</body>
</html>
